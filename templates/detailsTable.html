<form class="search-form" action="{%block path%}  {%endblock%}" method="POST">
  <input
    class="search-input"
    type="text"
    name="email"
    placeholder="Search By Email..."
  />
  <input name="btn"class="search-btn" type="submit" value="🍳" />
</form>
<div class="staff-main">
  <h1 class="staff-title">Id</h1>
  <h1 class="staff-title">Name</h1>
  <h1 class="staff-title">Role</h1>
  <h1 class="staff-title">Email</h1>
  <h1></h1>
  <!-- <h1 class="staff-title">Password</h1> -->
  {% for user in user %}
  <p class="staff-details {% if loop.index <= loop.index %} first-four{% endif %}">{{ user[0] }}</p>
  <p class="staff-details {% if loop.index <= loop.index %} first-four{% endif %}">{{ user[1] }}</p>
  <p class="staff-details {% if loop.index <= loop.index %} first-four{% endif %}">{{ user[2] }}</p>
  <p class="staff-details {% if loop.index <= loop.index %} first-four{% endif %}">{{ user[3] }}</p>
  <button onclick="editUser('{{ user[0] }}', '{{ user[1] }}', '{{ user[2] }}', '{{ user[3] }}')" class="staff-btn">Edit</button>
  <!-- <p class="staff-details {% if loop.index <= loop.index %} last-four{% endif %} ">{{ user[4] }}</p> -->
  {% endfor %}
</div>
